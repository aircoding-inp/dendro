[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dendro"
description = "A project's trace: how the work went, recorded as events, and the reports, slides and talks written from it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.scripts]
dendro = "dendro.cli:main"

[tool.setuptools]
packages = ["dendro", "dendro.collect"]

[tool.setuptools.dynamic]
version = { attr = "dendro.__version__" }

[tool.setuptools.package-data]
dendro = ["site/*", "guides/*"]
